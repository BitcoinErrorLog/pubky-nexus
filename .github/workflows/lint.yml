name: Lint

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "lint"
          cache-on-failure: true

      - name: Run clippy
        # Same scope as scripts/prepush.sh: every package and target (lib,
        # bins, tests, examples, benches), warnings fail. Clippy 1.99 reports
        # double_must_use on every #[async_trait] method (the macro adds
        # #[must_use] to a boxed future), so that lint is allowed.
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::double_must_use
